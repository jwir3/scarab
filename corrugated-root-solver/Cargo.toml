[package]
name = "corrugated_root_solver"
version = "0.1.0"
edition = "2024"

[lib]
name = "corrugated_root_solver"
crate-type = ["cdylib"]

[dependencies]
colored = "3.1.1"
fern = { version = "0.7.1", features = ["colored"] }
humantime = "2.4.0"
log = "0.4.35"
pyo3 = { version = "0.20", features = ["extension-module"] }
roots = "0.0.8"

[dev-dependencies]
approx = "0.5.1"
